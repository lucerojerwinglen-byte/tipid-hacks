name: Data pipeline

# Milestone 6 (ROADMAP.md): the pipeline now runs unattended on a weekly cron, not just on
# demand. Scheduled runs always commit (there's no one present to review a dry run) and always
# cover every wired chain; a failed run (thrown error or a DATA-PIPELINE.md §3 sanity-rule
# block) opens/updates a `pipeline-alert`-labelled GitHub issue instead of merging silently
# (DATA-PIPELINE.md §2 step 8 — silent auto-updating of bad data is the failure mode this whole
# project is designed against). workflow_dispatch is kept for on-demand runs (chain subset, dry
# run by default — see the `commit` input). No API key needed — every wired source is parsed
# deterministically (scripts/pipeline/parsers/), not via an LLM (DATA-PIPELINE.md §1). No
# Playwright/Chromium install step either: every currently wired source is a plain HTTP fetch.
# Re-add `npx playwright install --with-deps chromium` before "Run pipeline" if a JS-rendered
# chain gets wired back in.

on:
  workflow_dispatch:
    inputs:
      chains:
        description: "Space-separated chain ids to run (blank = every wired chain — see scripts/pipeline/sources.ts). Chowking isn't wired; DATA-PIPELINE.md §1."
        required: false
        default: ""
      commit:
        description: "Commit + push updated src/data/*.ts back to this branch (unchecked = dry run, output uploaded as an artifact instead)"
        type: boolean
        required: false
        default: false
  schedule:
    # Monday 00:00 UTC = Monday 08:00 PHT. Weekly cadence per DATA-PIPELINE.md §5/§6 — fast-food
    # chains don't reprice often enough to justify more.
    - cron: "0 0 * * 1"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine run mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "commit=${{ inputs.commit }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        id: run_pipeline
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.commit }}" = "true" ]; then
            git config user.name "barato-pipeline[bot]"
            git config user.email "barato-pipeline[bot]@users.noreply.github.com"
            npm run pipeline -- ${{ inputs.chains }} 2>&1 | tee pipeline.log
          else
            npm run pipeline -- ${{ inputs.chains }} --no-commit 2>&1 | tee pipeline.log
          fi

      - name: Push updated data
        if: ${{ steps.mode.outputs.commit == 'true' }}
        run: git push

      - name: Upload pipeline output (dry run only — nothing was committed)
        if: ${{ steps.mode.outputs.commit != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            src/data/*.ts
            data/checksums.json
          retention-days: 14

      - name: Alert on failure (DATA-PIPELINE.md §2 step 8, §3)
        if: always() && steps.run_pipeline.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LOG_TAIL=$(tail -c 60000 pipeline.log 2>/dev/null || echo "(no log captured)")
          {
            printf '%s\n\n' "The data pipeline run failed — a chain either threw during fetch/parse, or a DATA-PIPELINE.md §3 sanity rule blocked a commit. Nothing bad was merged; this just needs a human look."
            printf '**Run:** %s\n' "$RUN_URL"
            printf '**Trigger:** %s\n\n' "$TRIGGER"
            printf '<details>\n<summary>Pipeline log (tail)</summary>\n\n<pre>\n%s\n</pre>\n</details>\n' "$LOG_TAIL"
          } > pipeline-failure-body.md

          gh label create pipeline-alert --color B60205 --description "Automated pipeline failure alert" --repo "$REPO" 2>/dev/null || true

          EXISTING=$(gh issue list --repo "$REPO" --label pipeline-alert --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file pipeline-failure-body.md
          else
            gh issue create --repo "$REPO" --title "Pipeline run failed: $(date -u +%F)" --label pipeline-alert --body-file pipeline-failure-body.md
          fi
